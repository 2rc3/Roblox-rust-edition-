name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with cargo-quad-apk
        run: docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk cargo quad-apk build
      - uses: actions/upload-artifact@v4
        with:
          name: BlockVerse-apk
          path: target/android-artifacts/debug/apk/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BlockVerse (latest)
          files: target/android-artifacts/debug/apk/*.apk
